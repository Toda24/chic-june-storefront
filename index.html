<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chic June — Clothing & Luxury Jewelry Brand</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>

  <!-- Announcement Bar -->
  <div class="announcement-bar">
    ✨ Wear your sparkle with love... Worldwide shipping available ✨
  </div>

  <header>
    <div class="header-container">
      <a href="#" class="brand-logo-wrap">
        <div>
          <div class="brand-title">CHIC JUNE</div>
          <div class="brand-subtitle">CLOTHING & LUXURY JEWELRY BRAND ✨</div>
        </div>
      </a>

      <!-- Search Wrapper with Autocomplete Dropdown -->
      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Search earrings, necklaces, rings...">
        <div id="searchDropdown" class="search-results-dropdown"></div>
      </div>

      <button class="bag-btn" id="cartToggle">
        <span>Bag</span>
        <span class="bag-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main>
    <div class="product-grid" id="productGrid">
      <!-- Dynamic products injected via app.js -->
    </div>
  </main>

  <!-- Cart Side Drawer -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h2>Your Royal Bag</h2>
      <button id="closeCart" class="close-btn">&times;</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Total:</span>
        <span id="cartTotal">₦0</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn">Checkout with Paystack</button>
    </div>
  </div>

  <!-- Floating WhatsApp Widget -->
  <div class="whatsapp-widget" title="Chat with Us">
    💬
  </div>

  <script src="app.js"></script>
</body>
</html>
